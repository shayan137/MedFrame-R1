# MedFrame-R1 on Qwen3.5-4B (RL only, no cold start)

cold_start:
  enable: false

data:
  train_files: MBZUAI/medix-rl-data@train
  val_files: MBZUAI/medix-rl-data@test
  prompt_key: problem
  answer_key: solution
  image_key: image
  video_key: videos
  image_dir: null
  video_fps: 2.0
  max_prompt_length: 4352
  max_response_length: 4096
  rollout_batch_size: 512  # number of trainable groups per step
  mini_rollout_batch_size: 1024  # number of prompts per generation round
  val_batch_size: 1024
  format_prompt: ./examples/format_prompt/medical_format.jinja
  system_prompt: null
  override_chat_template: null
  order_file: null  # jsonl file of row ids to train on, see scripts/build_trainable_pool.py
  shuffle: true
  seed: 1
  min_pixels: 262144
  max_pixels: 4194304
  filter_overlong_prompts: true
  dataloader_num_workers: 2

algorithm:
  adv_estimator: grpo
  disable_kl: true
  use_kl_loss: true
  kl_penalty: low_var_kl
  kl_coef: 1.0e-2
  online_filtering: true  # dynamic sampling
  filter_key: accuracy_llm  # keep the groups with mixed judge decisions
  filter_low: 0.01
  filter_high: 0.99
  skip_empty_filter_batches: true
  carry_over:
    enable: true  # spare trainable groups are used in the next step
    max_groups: null  # null means rollout_batch_size - 1
  length_reward:
    enable: true
    threshold: 500  # tokens
    decay: 500  # tokens
    neg_scale: 1.0
    correct_threshold: 0.5

worker:
  actor:
    global_batch_size: 128
    micro_batch_size_per_device_for_update: 1
    micro_batch_size_per_device_for_experience: 1
    max_grad_norm: 1.0
    clip_ratio_low: 0.2
    clip_ratio_high: 0.3
    clip_ratio_dual: 3.0
    padding_free: true
    dynamic_batching: false
    ulysses_size: 1
    model:
      model_path: Qwen/Qwen3.5-4B
      enable_gradient_checkpointing: true
      trust_remote_code: false
      freeze_vision_tower: false
    optim:
      lr: 1.0e-6
      weight_decay: 1.0e-2
      strategy: adamw  # {adamw, adamw_bf16}
      lr_warmup_ratio: 0.0
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: true
      fsdp_size: 8  # shard inside a node, replicate across nodes
    offload:
      offload_params: true  # true: more CPU memory; false: more GPU memory
      offload_optimizer: false  # true: more CPU memory; false: more GPU memory

  rollout:
    n: 5
    temperature: 1.0
    top_p: 1.0
    limit_images: 0
    gpu_memory_utilization: 0.5
    enforce_eager: false
    enable_chunked_prefill: false
    tensor_parallel_size: 1
    max_num_batched_tokens: 16384
    async_scheduling: false
    disable_tqdm: false
    val_override_config:
      temperature: 0.6
      top_p: 0.95
      n: 1

  ref:
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false  # true: more CPU memory; false: more GPU memory
      enable_rank0_init: true
    offload:
      offload_params: false

  reward:
    reward_function: ./examples/reward_function/medical.py:compute_score
    reward_function_kwargs:
      format_weight: 0.1
      judge_model: Qwen/Qwen3.5-9B  # served by vllm_serve.sh
      judge_url: http://localhost:8085/v1
      judge_workers: 64
      embed_model: abhinand/MedEmbed-large-v0.1
      embed_batch_size: 16
      embed_threshold: 0.8
      embed_gate: true  # the judge only counts when the embedding agrees
      strict_format: true
      format_penalty: -1.0  # reward of a format violation
      strip_think: true  # score the text after the </think> tag

trainer:
  total_epochs: 2
  max_steps: 100
  project_name: medframe-r1
  experiment_name: medframe-r1_qwen3.5_4b
  logger: ["console", "file"]
  nnodes: 2
  n_gpus_per_node: 8
  max_try_make_batch: 100  # -1 means no limit
  val_freq: 10  # -1 to disable
  val_before_train: true
  val_only: false
  val_generations_to_log: 15
  log_rollouts: true
  save_freq: 5  # -1 to disable
  save_limit: 3  # -1 to disable
  save_model_only: false
  save_checkpoint_path: ./checkpoints/medframe-r1_qwen3.5_4b
  load_checkpoint_path: null
  find_last_checkpoint: true

eval:
  model: ../training/checkpoints/medframe-r1_qwen3.5_4b/global_step_100/actor/huggingface
  name: medframe-r1_qwen3.5_4b  # results are saved to <output_dir>/<name>
  tasks: ["all"]
  tasks_file: tasks.yaml
  output_dir: results
  num_workers: 256
  system_prompt: null
  max_tokens: 16384
  request_timeout: 3600
  tensor_parallel_size: 1
  data_parallel_size: 8
  max_model_len: 32768
  gpu_memory_utilization: 0.9
  enforce_eager: true
  seed: 0
  judge_server: local  # {local, openrouter}
  judges:
    - name: internvl
      model: OpenGVLab/InternVL3_5-30B-A3B-HF
    - name: gptoss
      model: openai/gpt-oss-20b
    - name: medgemma
      model: google/medgemma-27b-text-it
  judge_tensor_parallel_size: 2
  judge_data_parallel_size: 4
  judge_rounds: 1
  judge_max_tokens: 4096
  judge_max_tokens_mimic: 16384
  judge_timeout: 600
  exact_max_words: 25  # short answers up to this length are matched by rule
  binary_scope_words: 30  # yes/no is read from the first words of the response
  binary_final_words: 12  # yes/no is read from the words after a final answer marker
